# Memory settings merged for better performance
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Force disable incremental compilation to fix the D: drive root issue
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.incremental.multiplatform=false
